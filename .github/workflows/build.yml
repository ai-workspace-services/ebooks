name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', '*-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.m.outputs.books }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: .github/scripts/matrix.sh

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        book: ${{ fromJson(needs.matrix.outputs.books) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji poppler-utils ghostscript qpdf zip
          google-chrome --version
      - name: Python deps
        run: pip install -q pymupdf pypdf markdown pyyaml pillow numpy fonttools google-auth requests
      - name: Build ${{ matrix.book }}
        id: b
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: .github/scripts/build-book.sh "${{ matrix.book }}"
      - name: Optimize + zip ${{ matrix.book }}
        if: steps.b.outputs.outcome == 'built'
        id: z
        run: |
          echo '| book | pdf | pages | pdf bytes before | pdf bytes after | zip bytes | note |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/package-book.sh "${{ matrix.book }}"
      - if: steps.b.outputs.outcome == 'built'
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.book }}
          path: ${{ steps.z.outputs.zip }}
          compression-level: 0
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release.sh
